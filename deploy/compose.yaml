# Run from the repository root: docker compose -f deploy/compose.yaml <command>
#
#   docker compose -f deploy/compose.yaml up -d api          # HTTP API (feedback links, owner API)
#   docker compose -f deploy/compose.yaml run --rm digest aid run   # one pipeline run (the timer does this hourly)
#   docker compose -f deploy/compose.yaml run --rm digest aid migrate

x-aid: &aid
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: aid:latest
  env_file:
    - ../.env
  environment:
    DATABASE_PATH: /srv/aid/data/aid.sqlite3
    FASTEMBED_CACHE_PATH: /srv/aid/data/models
    API_HOST: 0.0.0.0
    API_PORT: "8000"
  volumes:
    - ../data:/srv/aid/data
  init: true

services:
  api:
    <<: *aid
    command: ["serve"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Not started by `up`; invoked by the systemd timer with `run --rm digest aid run`.
  digest:
    <<: *aid
    entrypoint: ["uv", "run"]
    command: ["aid", "run"]
    profiles: ["digest"]
