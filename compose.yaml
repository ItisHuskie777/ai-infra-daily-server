# docker compose up -d --build                           # API and hourly scheduler
# docker compose run --rm aid aid run --force --dry-run  # one-off commands
# docker compose run --rm aid aid sources list

x-aid: &aid
  build:
    context: .
    dockerfile: deploy/Dockerfile
    args:
      # The id of the host user that owns ./data (`id -u`).
      AID_UID: ${AID_UID:-1000}
  image: aid:latest
  env_file:
    - .env
  environment:
    DATABASE_PATH: /srv/aid/data/aid.sqlite3
    FASTEMBED_CACHE_PATH: /srv/aid/data/models
    API_HOST: 0.0.0.0
    API_PORT: "8000"
  volumes:
    - ./data:/srv/aid/data
  init: true
  security_opt:
    - no-new-privileges:true
  # The embedding model peaks near 3 GB; the cap protects whatever else the host runs.
  mem_limit: 6g

services:
  api:
    <<: *aid
    command: ["aid", "serve"]
    ports:
      # API_PUBLISH in .env picks the host address; loopback suits a reverse proxy.
      - "${API_PUBLISH:-127.0.0.1:8000}:8000"
    restart: unless-stopped

  # Wakes at the top of every hour; `aid run` exits at once outside the delivery hour.
  scheduler:
    <<: *aid
    command: ["sh", "deploy/scheduler.sh"]
    restart: unless-stopped

  aid:
    <<: *aid
    command: ["aid", "--help"]
    profiles: ["tools"]
