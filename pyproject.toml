[project]
name = "ai-infra-daily"
version = "3.0.0"
description = "Personal daily AI news digest: mainstream sources plus individual voices, clustered into events and threads."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
aid = "app.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "ANN", "ASYNC", "RUF", "SIM", "PL", "T20"]
ignore = ["PLR0913", "PLR2004", "ANN401"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/__init__.py" = ["F401"]
"app/**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = true
implicit_reexport = true
warn_unreachable = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*", "fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
